    <style>
      * {

        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {

      /* خلفية الصفحة صورة ps4.png مع تعتيم فخم */
      body::after {
        content: '';

          url('ps4.png') no-repeat center center fixed;
        background-size: cover;
        z-index: 0;
        pointer-events: none;
      }
      
      .system-bar {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 24px 0;
        padding: 12px 28px;
        background: rgba(18, 4, 8, 0.75);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        border: 1px solid rgba(255, 50, 80, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .brand-badge {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-logo-custom {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px;
        filter: drop-shadow(0 0 10px rgba(255, 40, 70, 0.5));
      }
      .brand-logo-custom img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .brand-text-mini {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 50, 80, 0.6);
      }

      /* حاوية الصفحة الكلية لتوزيع العناصر (منطقة التحميل في المنتصف، والعناوين في الأسفل) */
      #wrap {
        position: relative;
        z-index: 1;
        max-width: 1250px;
        margin: 0 auto;
        min-height: calc(100vh - 100px);
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* حاوية التحميل في المنتصف تماماً */
      .center-loader-area {
        margin: auto 0;
        text-align: center;
        position: relative;
        height: 120px;
      }

      #spin {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 90px;
        height: 90px;
        margin: -45px 0 0 -45px;
        border: 4px solid rgba(255, 50, 80, 0.15);
        border-top-color: #ff1a3c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        z-index: 10;
        background: rgba(18, 4, 8, 0.8);
        box-shadow: 0 0 25px rgba(255, 26, 60, 0.35);
      }

      #center-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        object-fit: contain;
        z-index: 11;
        filter: drop-shadow(0 0 10px rgba(255, 26, 60, 0.8));
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: absolute;
        top: calc(50% + 55px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #ff8598;
        display: none;
        z-index: 10;
        text-shadow: 0 0 10px rgba(255, 26, 60, 0.5);
      }
      
      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.done #center-logo {
        display: none;
      }
      body.fail #spin,
      body.fail #center-logo {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #34d399;
        font-weight: 900;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log */
      body.log #spin,
      body.log #center-logo,
      body.log #msg {
        display: none;
      }
      body.log #state {
        display: block;
        font-size: 26px;
        font-weight: 900;
        margin: 0 0 12px;
        color: #fff;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.45 Consolas, monospace;
        background: rgba(17, 21, 27, 0.85);
        border: 1px solid rgba(255, 50, 80, 0.3);
        border-radius: 16px;
        padding: 16px;
        height: calc(100vh - 140px);
        overflow-y: auto;
        color: #c8ced8;
      }

      /* شبكة كروت العناوين والفروع (المربعات الستة) في الأسفل تماماً */
      .footer-grid-container {
        margin-top: auto;
        padding-top: 20px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 1050px;
        margin: 0 auto;
      }

      .info-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: linear-gradient(135deg, rgba(35, 6, 12, 0.75), rgba(15, 2, 5, 0.85));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        border: 1px solid rgba(255, 60, 85, 0.35);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .info-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: #ff1a3c;
        box-shadow: 0 0 10px #ff1a3c;
      }

      .icon-box {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255, 30, 60, 0.18);
        border: 1px solid rgba(255, 60, 90, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .icon-box svg {
        width: 18px;
        height: 18px;
        fill: #ff4d66;
        filter: drop-shadow(0 0 6px #ff1a3c);
      }

      .card-details {
        display: flex;
        flex-direction: column;
        text-align: right;
        width: 100%;
      }

      .card-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #ff8598;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .card-main-text {
        font-size: 14px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.3;
      }

      .info-card.is-phone { direction: ltr; }
      .info-card.is-phone .card-details { text-align: left; }
      .info-card.is-phone .card-main-text {
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      @media (max-width: 1000px) {
        .info-grid { grid-template-columns: 1fr; max-width: 480px; }
      }

      .ok { color: #34d399; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      .safe { color: #34d399; }
      .danger { color: #f87171; }
      code { color: #9fb3d0; }
    </style>
