    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100vh;
        background-color: #050204;
        color: #fff;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle 800px at 50% -10%, rgba(255, 20, 50, 0.22), transparent 70%),
          radial-gradient(circle 600px at 50% 110%, rgba(180, 0, 30, 0.18), transparent 70%),
          linear-gradient(180deg, #090306 0%, #040102 100%);
        z-index: 0;
        pointer-events: none;
      }
      
      .system-bar {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 20px 24px 0;
        padding: 12px 28px;
        background: rgba(18, 4, 8, 0.75);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        border: 1px solid rgba(255, 50, 80, 0.3);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .brand-badge {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-logo-custom {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px;
        filter: drop-shadow(0 0 10px rgba(255, 40, 70, 0.5));
      }
      .brand-logo-custom img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .brand-text-mini {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(255, 50, 80, 0.6);
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% - 20px);
        left: 50%;
        width: 56px;
        height: 56px;
        margin: -28px 0 0 -28px;
        border: 4px solid rgba(255, 50, 80, 0.2);
        border-top-color: #ff1a3c;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        z-index: 10;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: calc(50% + 45px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #ff8598;
        display: none;
        z-index: 10;
      }
      
      #wrap {
        position: relative;
        z-index: 1;
        max-width: 1250px;
        margin: 20px auto 0;
        padding: 0 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #34d399;
        font-weight: 900;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #state {
        display: block;
        font-size: 26px;
        font-weight: 900;
        margin: 0 0 12px;
        color: #fff;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 13px/1.45 Consolas, monospace;
        background: rgba(17, 21, 27, 0.85);
        border: 1px solid rgba(255, 50, 80, 0.3);
        border-radius: 16px;
        padding: 16px;
        height: calc(100vh - 140px);
        overflow-y: auto;
        color: #c8ced8;
      }

      /* شبكة كروت العناوين والفروع (المربعات الستة) السفلية */
      .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 1050px;
        margin: 40px auto 0;
      }

      .info-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        background: linear-gradient(135deg, rgba(35, 6, 12, 0.75), rgba(15, 2, 5, 0.85));
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        border: 1px solid rgba(255, 60, 85, 0.35);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .info-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: #ff1a3c;
        box-shadow: 0 0 10px #ff1a3c;
      }

      .icon-box {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255, 30, 60, 0.18);
        border: 1px solid rgba(255, 60, 90, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .icon-box svg {
        width: 18px;
        height: 18px;
        fill: #ff4d66;
        filter: drop-shadow(0 0 6px #ff1a3c);
      }

      .card-details {
        display: flex;
        flex-direction: column;
        text-align: right;
        width: 100%;
      }

      .card-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #ff8598;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .card-main-text {
        font-size: 14px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.3;
      }

      .info-card.is-phone { direction: ltr; }
      .info-card.is-phone .card-details { text-align: left; }
      .info-card.is-phone .card-main-text {
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      @media (max-width: 1000px) {
        .info-grid { grid-template-columns: 1fr; max-width: 480px; }
      }

      .ok { color: #34d399; }
      .bad { color: #f87171; }
      .warn { color: #fbbf24; }
      .safe { color: #34d399; }
      .danger { color: #f87171; }
      code { color: #9fb3d0; }
    </style>
